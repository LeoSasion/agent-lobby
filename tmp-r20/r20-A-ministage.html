<head>

<title>r20 草案 A · 具象 mini 舞台</title>
<style>
  :root { --bg:#0a0d0b; --panel:#0e1210; --line:#1d2621; --grn:#45d98e; --grn-dim:#2a6b4a; --amb:#d9b13f; --dim:#6b7a72; --ink:#c9d6cf; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.6 "Georgia","Noto Serif SC",serif; padding:28px 32px; }
  .eyebrow { color:var(--amb); font-size:11px; letter-spacing:.35em; margin-bottom:6px; }
  h1 { color:var(--grn); font-size:22px; font-weight:400; letter-spacing:.12em; }
  .desc { color:var(--dim); font-size:12px; margin:8px 0 24px; max-width:760px; }
  .num { font-family:"Courier New",monospace; }
  .wall { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; max-width:1180px; }
  .tv { background:var(--panel); border:1px solid var(--line); padding:14px 16px; cursor:pointer; position:relative; }
  .tv:hover { border-color:var(--grn-dim); }
  .tvhead { display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:10px; }
  .tvno { color:var(--dim); font-size:11px; }
  .tvname { color:var(--ink); font-size:14px; letter-spacing:.2em; }
  .livedot { margin-left:auto; color:var(--grn); font-size:10px; letter-spacing:.25em; }
  .livedot::before { content:"●"; margin-right:5px; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }

  /* ===== 具象 mini 舞台 ===== */
  .ministage { height:118px; position:relative; margin:4px 0 10px; }

  /* 狼人：昼夜徽章 + 席位环 */
  .mn-orb { position:absolute; left:0; top:6px; width:54px; height:54px; }
  .mn-orb svg { width:100%; height:100%; }
  .mn-orb .lab { position:absolute; top:58px; left:0; width:54px; text-align:center; color:var(--dim); font-size:10px; letter-spacing:.2em; }
  .seatring { position:absolute; left:96px; top:6px; width:100px; height:100px; }
  .seatring .sd { position:absolute; width:13px; height:13px; border-radius:50%; background:var(--grn); box-shadow:0 0 6px rgba(69,217,142,.5); transition:all .5s; }
  .seatring .sd.off { background:#232c27; box-shadow:none; }
  .seatring .sd::after { content:attr(data-s); position:absolute; top:-15px; left:2px; color:var(--dim); font-size:9px; font-family:"Courier New",monospace; }
  .mn-side { position:absolute; right:0; top:10px; text-align:right; }
  .mn-side .big { color:var(--grn); font-size:26px; }
  .mn-side .sub { color:var(--dim); font-size:10px; letter-spacing:.15em; }

  /* 骰子：余骰阵列 + 叫价徽章 */
  .dice-rows { position:absolute; left:0; top:4px; }
  .dice-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; transition:opacity .5s; }
  .dice-row .s { color:var(--dim); font-size:10px; width:14px; font-family:"Courier New",monospace; }
  .mini-die { width:11px; height:11px; border:1px solid var(--grn-dim); position:relative; }
  .mini-die i { position:absolute; width:3px; height:3px; background:var(--grn); top:4px; left:4px; }
  .dice-row.dead { opacity:.18; }
  .bid-badge { position:absolute; right:0; top:8px; text-align:right; }
  .bid-badge .face { color:var(--amb); font-size:30px; letter-spacing:.06em; }
  .bid-badge .sub { color:var(--dim); font-size:10px; letter-spacing:.15em; }
  .turn-arrow { position:absolute; right:0; bottom:2px; color:var(--grn); font-size:10px; letter-spacing:.15em; }

  /* 德州：街徽 + 底池 + 公共牌 + 筹码条 */
  .street-badge { position:absolute; left:0; top:6px; color:var(--amb); font-size:11px; letter-spacing:.25em; border:1px solid #3a3320; padding:3px 10px; }
  .pot-big { position:absolute; right:0; top:2px; text-align:right; }
  .pot-big .v { color:var(--grn); font-size:24px; }
  .pot-big .l { color:var(--dim); font-size:10px; letter-spacing:.2em; }
  .comm { position:absolute; left:0; top:42px; display:flex; gap:5px; }
  .mini-card { width:26px; height:36px; border:1px solid var(--line); background:#111613; color:var(--ink); font-family:"Courier New",monospace; font-size:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
  .mini-card.r { color:#d96b6b; }
  .mini-card.empty { border-style:dashed; opacity:.35; }
  .chip-bars { position:absolute; left:0; bottom:0; display:flex; gap:8px; width:100%; }
  .chip-bar { flex:1; }
  .chip-bar .bar { height:5px; background:var(--grn-dim); position:relative; transition:width .6s; }
  .chip-bar .bar i { display:block; height:100%; background:var(--grn); }
  .chip-bar .t { color:var(--dim); font-size:9px; font-family:"Courier New",monospace; margin-top:3px; }
  .chip-bar.fold { opacity:.25; }

  /* 黑白棋：微缩棋枰 */
  .grid8 { position:absolute; left:0; top:4px; display:grid; grid-template-columns:repeat(8,13px); grid-template-rows:repeat(8,13px); gap:1px; background:var(--line); border:1px solid var(--line); }
  .cell { background:#0c110e; position:relative; }
  .cell.b::after, .cell.w::after { content:""; position:absolute; inset:2px; border-radius:50%; }
  .cell.b::after { background:#dfe8e2; }
  .cell.w::after { background:#8f9c95; }
  .oth-side { position:absolute; right:0; top:10px; text-align:right; }
  .oth-side .pair { font-size:18px; }
  .oth-side .pair b.b { color:#dfe8e2; } .oth-side .pair b.w { color:#8f9c95; }
  .oth-side .sub { color:var(--dim); font-size:10px; letter-spacing:.15em; }

  /* 通用 nowline / foot */
  .nowline { display:flex; gap:8px; align-items:baseline; border-top:1px solid var(--line); padding-top:8px; }
  .nowline .tag { color:var(--amb); font-size:9px; letter-spacing:.2em; border:1px solid #3a3320; padding:1px 6px; flex:none; }
  .nowline .txt { color:var(--ink); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tvfoot { display:flex; gap:16px; color:var(--dim); font-size:11px; margin-top:8px; }
  .tvfoot b { color:var(--ink); }
  .tvfoot .go { margin-left:auto; color:var(--grn); font-size:11px; letter-spacing:.1em; }

  /* 磷光脉冲 */
  .flash { animation:pulseG 1.1s ease-out; }
  @keyframes pulseG { 0% { box-shadow:0 0 0 0 rgba(69,217,142,.55); } 100% { box-shadow:0 0 0 14px rgba(69,217,142,0); } }
  .flashA { animation:pulseA 1.1s ease-out; }
  @keyframes pulseA { 0% { box-shadow:0 0 0 0 rgba(217,177,63,.55); } 100% { box-shadow:0 0 0 14px rgba(217,177,63,0); } }
  .tick-note { margin-top:22px; color:var(--dim); font-size:11px; border-top:1px dashed var(--line); padding-top:12px; max-width:760px; }
</style>

window.__DATA__ = {"wolf":{"view":{"game":"werewolf_lite","phase":"finished","round":2,"public":{"round":2,"phase":"finished","seats":[1,2,3,4,5,6],"alive_seats":[2,4],"today_says":[{"seat":3,"text":"3号遗言。我是普通村民，6号把我验成狼是误验，我被冤杀，认了，大局为重。现在场上只剩1/2/4，狼只有一只。提醒两位：6号死后他的话成了圣旨，但你们想想，狼巴不得你们按遗言互咬。我观察两天：2号发言永远安全、从不给核心表态；4号从第一天就急着立「1号藏金水」的靶子带节奏，今天大概率继续收割这条线。谁在带节奏、谁在躲事，请用票说话。别弃票，票错一票就是送狼赢。祝真好人好运。","kind":"last_words"},{"seat":6,"text":"6号预言家遗言：第二夜验了1号，是狼人！我死后场上1/2/4三人，唯一狼就是1号，2号4号直接投1号即胜。铁证链：第一晚验3号是狼→已放逐验证；昨晚验1号→是狼。3号遗言恰恰反向实锤狼身份：他喊冤却全程替1号洗地，还试图让你们互咬、踩真好人4号带节奏。1号第一天那句「金水可先藏一轮」正是狼希望信息少。2号4号务必都投1号，别弃票，这票投完好人就赢。","kind":"last_words"},{"seat":1,"text":"1号回应。6号指认我，但请2号看硬证据：昨天放逐3号的4票里，我1号是第一时间跟投的。狼会亲手送走自己唯一的队友、甘当孤狼等死吗？不会。反倒是4号，第一天就抓我一句措辞立靶子，今天又被6号顺势认证成好人，这条节奏顺得可疑。我不回避被验的处境，但今天我就是好人。我的票投4号。2号，投3号那票我们站在一起，请把票集中到4号，别让死者的遗言替你思考。","kind":"say"},{"seat":2,"text":"2号村民。硬逻辑梳理：6号预言家身份已双重验证——验3号是狼且3被放逐，随后狼连夜刀6灭口；狼不会刀自己人，6必真预言家。那么他第二验「1号是狼」同样可信。1号辩称狼不会送走队友，恰恰不成立：3号被查杀后大势已去，你跟投是弃车保帅的标准止损，不跟反而暴露。3号遗言全程替1号洗地、反咬我和4号，正是狼队友的临死操作。我的票投1号，请4号一起跟，这票落对好人直接赢。","kind":"say"},{"seat":4,"text":"4号村民。我确认投1号，理由：6号真预言家双重验证——验3号是狼且3被放逐后遗言全程替1号洗地、反咬好人，行为已实锤；狼连夜刀6灭口更证明6是真身。1号说狼不会投队友不成立：3号被查杀大势已去，跟投止损正是弃车保帅。加上你第一天「金水可先藏一轮」的反信息建议，三条线都指向你。2号逻辑我完全认可。这票我投1号，好人赢面就在此票，绝不弃票。","kind":"say"}],"last_day_says":[{"seat":5,"text":"我是5号，普通村民，第一夜被刀。没有查验信息，只能给建议：预言家请今天跳明身份报查验，大家围绕金水/查杀梳理票型。场上剩1/2/3/4/6五人，2狼1预言家2民。狼首夜刀我这个普通位，大概率是随机刀，别过度解读。听发言时注意谁在刻意带节奏、谁发言空洞躲事。好人千万别弃票，票型集中，宁可投错也别弃。祝好人赢。","kind":"last_words"},{"seat":1,"text":"1号好人视角。首夜刀5号是普通位，随机性大，不必过度联想。现在5人局2狼，关键在预言家：若昨晚验到查杀务必今天跳出来报，好人跟票；若验到金水可先藏一轮。我暂无硬信息，先听2、3、4、6发言，重点看谁急着扣帽子、谁只顾自保。我不弃票，听完会给出票向。","kind":"say"},{"seat":2,"text":"2号普通村民。首夜刀5号基本是随机刀，无信息量，我也无硬信息。我的态度：预言家今天请直接跳明报查验，查杀金水都报出来，好人围绕查验梳票型；藏着不说就是帮狼。1号发言偏稳，暂不怀疑。我重点听3、4、6的发言，看谁躲事、谁乱带票向。我承诺绝不弃票，今天必须放逐一人，票型不集中就是送狼赢。","kind":"say"},{"seat":3,"text":"3号普通村民。首夜刀5号信息量有限，倾向随机刀，不强行联想。同意前面两位的观点：预言家今天最好跳明报查验，金水查杀都摆出来，好人票型围绕查验走，藏着不说只会让狼混水摸鱼。1号2号发言都有实质内容，暂不怀疑。我重点听4号6号，看谁发言空洞躲事、谁硬带节奏。我承诺不弃票，听完给票向。","kind":"say"},{"seat":4,"text":"4号普通村民。首夜 。"}},"visibility":"all"},{"seq":41,"type":"said","data":{"seat":1,"text":"1号回应。6号指认我，但请2号看硬证据：昨天放逐3号的4票里，我1号是第一时间跟投的。狼会亲手送走自己唯一的队友、甘当孤狼等死吗？不会。反倒是4号，第一天就抓我一句措辞立靶子，今天又被6号顺势认证成好人，这条节奏顺得可疑。我不回避被验的处境，但今天我就是好人。我的票投4号。2号，投3号那票我们站在一起，请把票集中到4号，别让死者的遗言替你思考。"},"visibility":"all"},{"seq":42,"type":"acted","data":{"seat":2,"action":{"type":"say","text":"2号村民。硬逻辑梳理：6号预言家身份已双重验证——验3号是狼且3被放逐，随后狼连夜刀6灭口；狼不会刀自己人，6必真预言家。那么他第二验「1号是狼」同样可信。1号辩称狼不会送走队友，恰恰不成立：3号被查杀后大势已去，你跟投是弃车保帅的标准止损，不跟反而暴露。3号遗言全程替1号洗地、反咬我和4号，正是狼队友的临死操作。我的票投1号，请4号一起跟，这票落对好人直接赢。"}},"visibility":"all"},{"seq":43,"type":"said","data":{"seat":2,"text":"2号村民。硬逻辑梳理：6号预言家身份已双重验证——验3号是狼且3被放逐，随后狼连夜刀6灭口；狼不会刀自己人，6必真预言家。那么他第二验「1号是狼」同样可信。1号辩称狼不会送走队友，恰恰不成立：3号被查杀后大势已去，你跟投是弃车保帅的标准止损，不跟反而暴露。3号遗言全程替1号洗地、反咬我和4号，正是狼队友的临死操作。我的票投1号，请4号一起跟，这票落对好人直接赢。"},"visibility":"all"},{"seq":44,"type":"acted","data":{"seat":4,"action":{"type":"say","text":"4号村民。我确认投1号，理由：6号真预言家双重验证——验3号是狼且3被放逐后遗言全程替1号洗地、反咬好人，行为已实锤；狼连夜刀6灭口更证明6是真身。1号说狼不会投队友不成立：3号被查杀大势已去，跟投止损正是弃车保帅。加上你第一天「金水可先藏一轮」的反信息建议，三条线都指向你。2号逻辑我完全认可。这票我投1号，好人赢面就在此票，绝不弃票。"}},"visibility":"all"},{"seq":45,"type":"said","data":{"seat":4,"text":"4号村民。我确认投1号，理由：6号真预言家双重验证——验3号是狼且3被放逐后遗言全程替1号洗地、反咬好人，行为已实锤；狼连夜刀6灭口更证明6是真身。1号说狼不会投队友不成立：3号被查杀大势已去，跟投止损正是弃车保帅。加上你第一天「金水可先藏一轮」的反信息建议，三条线都指向你。2号逻辑我完全认可。这票我投1号，好人赢面就在此票，绝不弃票。"},"visibility":"all"},{"seq":46,"type":"phase_started","data":{"phase":"day_vote","round":2},"visibility":"all"},{"seq":47,"type":"acted","data":{"seat":1,"action":{"type":"vote","target":4}},"visibility":"all"},{"seq":48,"type":"acted","data":{"seat":2,"action":{"type":"vote","target":1}},"visibility":"all"},{"seq":49,"type":"acted","data":{"seat":4,"action":{"type":"vote","target":1}},"visibility":"all"},{"seq":50,"type":"vote_result","data":{"tally":{"1":2,"4":1},"exiled":1,"passed":[],"pk":false},"visibility":"all"},{"seq":51,"type":"player_died","data":{"seat":1,"cause":"vote"},"visibility":"all"},{"seq":52,"type":"game_won","data":{"winner":"good","roles":{"1":"werewolf","2":"villager","3":"werewo <script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const D = window.__DATA__;

/* ---------- 狼人杀 mini ---------- */
function orbSVG(phase) {
  const isNight = phase === "night";
  return `<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="none" stroke="${isNight ? "#3b4a63" : "#d9b13f"}" stroke-width="1.5" opacity=".8"/>${
    isNight
      ? `<path d="M34 8 a19 19 0 1 0 0 38 a15 15 0 1 1 0 -38z" fill="#3b4a63"/>`
      : `<circle cx="27" cy="27" r="9" fill="#d9b13f"/><g stroke="#d9b13f" stroke-width="1.5">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${27+12*Math.cos(r)}" y1="${27+12*Math.sin(r)}" x2="${27+18*Math.cos(r)}" y2="${27+18*Math.sin(r)}"/>`}).join("")}</g>`
  }</svg>`;
}
function renderWolf(st) {
  const seats = st.seats || [], alive = st.alive || [];
  const ring = seats.map(s => {
    const ang = (-90 + (360/seats.length)*(s-1)) * Math.PI/180;
    const R = 38, cx = 50 + R*Math.cos(ang), cy = 50 + R*Math.sin(ang);
    return `<span class="sd ${alive.includes(s) ? "" : "off"}" data-s="${s}" style="left:${cx-6}px;top:${cy-6}px"></span>`;
  }).join("");
  $("#tv-wolf").innerHTML = `
    <div class="tvhead"><span class="tvno num">CH-01 · m_hvi4lg44</span><span class="tvname">狼人杀 · 简化版</span><span class="livedot">直播中</span></div>
    <div class="ministage">
      <div class="mn-orb" id="mn-orb">${orbSVG(st.phase)}<div class="lab">${st.phase === "night" ? "夜" : "昼"}</div></div>
      <div class="seatring">${ring}</div>
      <div class="mn-side"><div class="big num">${alive.length}<span style="color:var(--dim);font-size:14px">/${seats.length}</span></div><div class="sub">存活 · 第 ${st.round} 天</div></div>
    </div>
    <div class="nowline"><span class="tag">now</span><span class="txt">${esc(st.now || "…")}</span></div>
    <div class="tvfoot"><span>相位 <b class="num" id="wf-ph">${st.phase === "night" ? "夜间行动" : "白天讨论"}</b></span><span class="go">进入围观 →</span></div>`;
}

/* ---------- 骰子 mini ---------- */
function renderDice(st) {
  const rows = (st.players || []).map(p => `
    <div class="dice-row ${p.dice_count ? "" : "dead"}"><span class="s num">${p.seat}</span>${
      Array.from({length:5}, (_,i) => `<span class="mini-die">${i < p.dice_count ? "<i></i>" : ""}</span>`).join("")
    }</div>`).join("");
  const bid = st.bid ? `<div class="face num">叫 ${st.bid.qty}×${st.bid.face}</div>` : `<div class="face num" style="color:var(--dim)">开叫权</div>`;
  $("#tv-dice").innerHTML = `
    <div class="tvhead"><span class="tvno num">CH-02 · m_gn9wsl21</span><span class="tvname">吹牛骰</span><span class="livedot">直播中</span></div>
    <div class="ministage">
      <div class="dice-rows">${rows}</div>
      <div class="bid-badge" id="bid-b">${bid}<div class="sub">${st.turn ? "轮到 " + st.turn + " 号" : ""}</div></div>
    </div>
    <div class="nowline"><span class="tag">now</span><span class="txt">${esc(st.now || "…")}</span></div>
    <div class="tvfoot"><span>第 <b class="num">${st.round}</b> 轮</span><span>总骰 <b class="num">${(st.players||[]).reduce((a,p)=>a+p.dice_count,0)}</b></span><span class="go">进入围观 →</span></div>`;
}

/* ---------- 德州 mini ---------- */
const SUIT_CHAR = { s:"♠",h:"♥",d:"♦",c:"♣" };
function cardTxt(c) { return `${c.rank}<br>${SUIT_CHAR[c.suit]||"?"}`; }
function renderHoldem(st) {
  const comm = [0,1,2,3,4].map(i => {
    const c = (st.community || [])[i];
    return c ? `<div class="mini-card ${(c.suit==="h"||c.suit==="d") ? "r":""}">${cardTxt(c)}</div>` : `<div class="mini-card empty">?</div>`;
  }).join("");
  const bars = (st.players || []).map(p => `
    <div class="chip-bar ${p.folded || p.chips===0 ? "fold" : ""}"><div class="bar"><i style="width:${Math.min(100, p.chips/(st.starting||1000)*100)}%"></i></div><div class="t">${p.seat}·${p.chips}</div></div>`).join("");
  $("#tv-holdem").innerHTML = `
    <div class="tvhead"><span class="tvno num">CH-03 · m_uc7goq6k</span><span class="tvname">德州扑克 · 简化版</span><span class="livedot">直播中</span></div>
    <div class="ministage">
      <span class="street-badge">${st.street || "preflop"}</span>
      <div class="pot-big"><div class="v num" id="pot-v">${st.pot ?? 0}</div><div class="l">底池 · 第 ${st.hand} 手</div></div>
      <div class="comm">${comm}</div>
      <div class="chip-bars">${bars}</div>
    </div>
    <div class="nowline"><span class="tag">now</span><span class="txt">${esc(st.now || "…")}</span></div>
    <div class="tvfoot"><span>在打 <b class="num">${st.to_act ?? "—"}</b> 号</span><span>注 <b class="num">${st.current_bet ?? 0}</b></span><span class="go">进入围观 →</span></div>`;
}

/* ---------- 黑白棋 mini ---------- */
function renderOthello(st) {
  const cells = Array.from({length:64}, (_,i) => `<span class="cell ${(st.board||[])[i]===1?"b":(st.board||[])[i]===2?"w":""}"></span>`).join("");
  $("#tv-othello").innerHTML = `
    <div class="tvhead"><span class="tvno num">CH-04 · m_n56unofg</span><span class="tvname">黑白棋</span><span class="livedot">直播中</span></div>
    <div class="ministage">
      <div class="grid8">${cells}</div>
      <div class="oth-side"><div class="pair num"><b class="b">${st.black ?? 2}</b> : <b class="w">${st.white ?? 2}</b></div><div class="sub">黑 : 白 · 第 ${st.hand} 手</div></div>
    </div>
    <div class="nowline"><span class="tag">now</span><span class="txt">${esc(st.now || "…")}</span></div>
    <div class="tvfoot"><span>轮 <b class="num">${st.turn === 1 ? "黑" : "白"}</b></span><span class="go">进入围观 →</span></div>`;
}

/* ---------- 模拟推进引擎：从真实事件流提取关键帧回放 ---------- */
const S = {
  wolf:  { seats:[1,2,3,4,5,6], alive:[1,2,3,4,5,6], phase:"night", round:1, now:"第 1 夜 · 行动中" },
  dice:  { players:(D.dice.view.public?.players||[]).map(p=>({...p})), bid:null, turn:1, round:1, now:"开叫权 · 1 号" },
  holdem:{ players:(D.holdem.view.public?.players||[]).map(p=>({...p})), community:[], pot:0, street:"preflop", hand:1, to_act:1, current_bet:0, starting:1000, now:"盲注已下" },
  othello:{ board:Array(64).fill(0), black:2, white:2, hand:1, turn:1, now:"黑先" },
};
(function initOth() { const b=S.othello.board; b[27]=2;b[28]=1;b[35]=1;b[36]=2; })();

function evText(type, d) {
  switch (type) {
    case "phase_started": return d.phase === "night" ? "夜幕降临 · 狼人睁眼" : "天亮了 · 白天讨论";
    case "said": return `${d.seat} 号：${String(d.text||"").slice(0,42)}`;
    case "last_words": return `遗言 · ${d.seat} 号：${String(d.text||"").slice(0,36)}`;
    case "player_died": return `${d.seat} 号倒下了`;
    case "vote_result": return `放逐 ${d.exiled} 号（${JSON.stringify(d.tally||{})}）`;
    case "game_won": return `终局 · ${d.winner === "good" ? "好人胜" : "狼人胜"}`;
    case "bid_placed": return `${d.seat} 号叫 ${d.qty}×${d.face}`;
    case "challenge_resolved": return `${d.challenger} 号质疑 ${d.challenged_bid?.seat} 号 · 实际 ${d.actual_count} 个`;
    case "round_started": return `第 ${d.round} 轮开始`;
    case "blind_posted": return `${d.seat} 号下${d.blind === "small" ? "小" : "大"}盲 ${d.amount}`;
    case "action": return `${d.seat} 号 ${d.action}${d.amount ? " " + d.amount : ""}${d.to ? "（至 " + d.to + "）" : ""}`;
    case "street_dealt": return `${d.street} 发牌 ${JSON.stringify(d.cards||[])}`;
    case "placed": return `${d.seat === 1 ? "黑" : "白"} 落子 ${d.cell}${(d.flipped||[]).length ? " 翻 " + d.flipped.length + " 子" : ""}`;
    case "street_dealt_h": return "";
    default: return type;
  }
}

const QUEUES = {
  wolf: D.wolf.events.map(e => ({ type:e.type, d:e.data||{} })),
  dice: D.dice.events.filter(e => /bid_placed|challenge_resolved|round_started/.test(e.type)).map(e => ({ type:e.type, d:e.data||{} })),
  holdem: D.holdem.events.filter(e => /phase_started|^action$|blind_posted|hand_started|street_dealt/.test(e.type)).map(e => ({ type:e.type, d:e.data||{} })),
  othello: D.othello.events.filter(e => /placed|pass|phase_started/.test(e.type)).map(e => ({ type:e.type, d:e.data||{} })),
};
const PTR = { wolf:0, dice:0, holdem:0, othello:0 };

function applyEv(game, type, d) {
  const st = S[game];
  let pulse = null;
  switch (game) {
    case "wolf":
      if (type === "phase_started") { st.phase = d.phase; st.round = d.round ?? st.round; pulse = "#mn-orb"; }
      if (type === "player_died") { st.alive = st.alive.filter(x => x !== d.seat); pulse = null; }
      if (type === "vote_result") { st.alive = st.alive.filter(x => x !== d.exiled); }
      if (type === "game_won") { st.now = "对局结束"; }
      else if (evText(type,d)) st.now = evText(type, d);
      renderWolf(st);
      break;
    case "dice":
      if (type === "bid_placed") { st.bid = { qty:d.qty, face:d.face }; st.turn = (d.seat % 6) + 1; pulse = "#bid-b"; }
      if (type === "challenge_resolved") { st.bid = null; pulse = "#bid-b"; }
      if (type === "round_started") { st.round = d.round; }
      if (evText(type,d)) st.now = evText(type, d);
      renderDice(st);
      break;
    case "holdem":
      if (type === "hand_started") { st.hand = d.hand_no ?? st.hand; st.community = []; st.street = "preflop"; st.pot = 0; }
      if (type === "phase_started" && d.phase) { st.street = d.phase; }
      if (type === "street_dealt") {
        st.community = (d.cards || []).map(s => ({ rank: String(s).slice(0, -1), suit: String(s).slice(-1) }));
        st.street = d.street || st.street; pulse = ".comm";
      }
      if (type === "blind_posted") { st.pot += d.amount ?? 0; pulse = "#pot-v"; }
      if (type === "action") {
        if (d.amount) { st.pot += d.amount; pulse = "#pot-v"; }
        if (d.action === "fold") { const p = st.players.find(x => x.seat === d.seat); if (p) p.folded = true; }
        st.to_act = (d.seat % 4) + 1; st.current_bet = d.to ?? st.current_bet;
      }
      if (evText(type,d)) st.now = evText(type, d);
      renderHoldem(st);
      break;
    case "othello":
      if (type === "placed") {
        if (Number.isInteger(d.cell) && d.cell >= 0 && d.cell < 64) st.board[d.cell] = d.seat;
        (d.flipped || []).forEach(i => { if (i >= 0 && i < 64) st.board[i] = d.seat; });
        st.black = st.board.filter(v => v === 1).length;
        st.white = st.board.filter(v => v === 2).length;
        st.hand++; st.turn = d.seat === 1 ? 2 : 1; pulse = ".grid8";
      }
      if (evText(type,d)) st.now = evText(type, d);
      renderOthello(st);
      break;
  }
  if (pulse) { const el = document.querySelector(`#tv-${game==="wolf"?"wolf":game} ${pulse}`); if (el) { el.classList.remove("flash","flashA"); void el.offsetWidth; el.classList.add("flash"); } }
}

/* 初始渲染 */
renderWolf(S.wolf); renderDice(S.dice); renderHoldem(S.holdem); renderOthello(S.othello);

/* 推进循环：轮转四桌，~0.9s 一个事件 */
const ORDER = ["wolf","dice","holdem","othello"];
let oi = 0;
setInterval(() => {
  for (let k = 0; k < ORDER.length; k++) {
    const g = ORDER[(oi + k) % ORDER.length];
    if (PTR[g] < QUEUES[g].length) {
      const e = QUEUES[g][PTR[g]++];
      applyEv(g, e.type, e.d);
      oi = (oi + k + 1) % ORDER.length;
      return;
    }
  }
  /* 全部队列耗尽：狼人杀循环回放 */
  PTR.wolf = 0; S.wolf = { seats:[1,2,3,4,5,6], alive:[1,2,3,4,5,6], phase:"night", round:1, now:"第 1 夜 · 行动中" };
}, 900);
</script>
